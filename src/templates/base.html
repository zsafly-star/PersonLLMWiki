    <style>
    .custom-confirm-overlay {
        position: fixed; inset: 0; z-index: 100000;
        background: rgba(0,0,0,0.35);
        display: none; align-items: center; justify-content: center;
    }
    .custom-confirm-overlay.open { display: flex; }

    .toast-tip {
        position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px);
        background: rgba(33,33,33,0.92); color: #fff; padding: 8px 18px; border-radius: 8px;
        font-size: 13px; z-index: 100001; opacity: 0; transition: opacity 200ms ease, transform 200ms ease;
        pointer-events: none; white-space: nowrap;
    }
    .toast-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .custom-confirm-box {
        background: #fff; border-radius: 12px; padding: 24px;
        max-width: 360px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        animation: cc-in 200ms ease-out;
    }
    @keyframes cc-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .custom-confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #1a1a1a; }
    .custom-confirm-msg { font-size: 14px; color: #6B7280; line-height: 1.5; margin-bottom: 20px; }
    .custom-confirm-btns { display: flex; gap: 10px; justify-content: flex-end; }
    .cc-btn { padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 150ms ease; }
    .cc-btn-cancel { background: #F3F4F6; color: #6B7280; }
    .cc-btn-cancel:hover { background: #E5E7EB; }
    .cc-btn-ok { background: #EF4444; color: #fff; }
    .cc-btn-ok:hover { background: #DC2626; }
    .cc-btn-ok.cc-btn-primary { background: #0d9488; }
    .cc-btn-ok.cc-btn-primary:hover { background: #0f766e; }
    </style>

    <script>
    /**
     * 全局自定义确认弹窗（替代原生 confirm）
     * 用法: if (await customConfirm('确定删除？')) { ... }
     */
    function customConfirm(message, title, options) {
        return new Promise(function(resolve) {
            var overlay = document.getElementById('custom-confirm-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'custom-confirm-overlay';
                overlay.className = 'custom-confirm-overlay';
                overlay.innerHTML =
                    '<div class="custom-confirm-box">' +
                    '<div class="custom-confirm-title" id="cc-title"></div>' +
                    '<div class="custom-confirm-msg" id="cc-msg"></div>' +
                    '<div class="custom-confirm-btns">' +
                    '<button class="cc-btn cc-btn-cancel" id="cc-cancel">取消</button>' +
                    '<button class="cc-btn cc-btn-ok" id="cc-ok">确定</button>' +
                    '</div></div>';
                document.body.appendChild(overlay);
            }

            var titleEl = overlay.querySelector('#cc-title');
            var msgEl = overlay.querySelector('#cc-msg');
            var okBtn = overlay.querySelector('#cc-ok');
            var cancelBtn = overlay.querySelector('#cc-cancel');

            titleEl.textContent = title || '确认操作';
            msgEl.textContent = message || '';

            // 按钮样式（危险/主色）
            okBtn.className = 'cc-btn cc-btn-ok' + (options && options.primary ? ' cc-btn-primary' : '');
            okBtn.textContent = (options && options.okText) || '确定';
            cancelBtn.textContent = (options && options.cancelText) || '取消';
            cancelBtn.style.display = '';

            overlay.classList.add('open');

            function close(val) {
                overlay.classList.remove('open');
                okBtn.onclick = null;
                cancelBtn.onclick = null;
                overlay.onclick = null;
                resolve(val);
            }

            okBtn.onclick = function() { close(true); };
            cancelBtn.onclick = function() { close(false); };
            overlay.onclick = function(e) { if (e.target === overlay) close(false); };
        });
    }

    /**
     * 全局自定义提示弹窗（替代原生 alert）
     */
    function customAlert(message, title) {
        return new Promise(function(resolve) {
            var overlay = document.getElementById('custom-confirm-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'custom-confirm-overlay';
                overlay.className = 'custom-confirm-overlay';
                overlay.innerHTML =
                    '<div class="custom-confirm-box">' +
                    '<div class="custom-confirm-title" id="cc-title"></div>' +
                    '<div class="custom-confirm-msg" id="cc-msg"></div>' +
                    '<div class="custom-confirm-btns">' +
                    '<button class="cc-btn cc-btn-ok cc-btn-primary" id="cc-ok">确定</button>' +
                    '</div></div>';
                document.body.appendChild(overlay);
            }

            // 确保 cancel 按钮存在（alert 模式下隐藏）
            var cancelBtn = overlay.querySelector('#cc-cancel');
            if (!cancelBtn) {
                cancelBtn = document.createElement('button');
                cancelBtn.id = 'cc-cancel';
                cancelBtn.className = 'cc-btn cc-btn-cancel';
                cancelBtn.textContent = '取消';
                var btns = overlay.querySelector('.custom-confirm-btns');
                btns.insertBefore(cancelBtn, btns.firstChild);
            }
            cancelBtn.style.display = 'none';

            var titleEl = overlay.querySelector('#cc-title');
            var msgEl = overlay.querySelector('#cc-msg');
            var okBtn = overlay.querySelector('#cc-ok');

            titleEl.textContent = title || '提示';
            msgEl.textContent = message || '';
            okBtn.className = 'cc-btn cc-btn-ok cc-btn-primary';
            okBtn.textContent = '确定';

            overlay.classList.add('open');

            function close() {
                overlay.classList.remove('open');
                okBtn.onclick = null;
                overlay.onclick = null;
                resolve();
            }

            okBtn.onclick = close;
            overlay.onclick = function(e) { if (e.target === overlay) close(); };
        });
    }

    function showToast(message) {
        var t = document.querySelector('.toast-tip');
        if (!t) {
            t = document.createElement('div');
            t.className = 'toast-tip';
            document.body.appendChild(t);
        }
        t.textContent = message;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show'); }, 1500);
    }
    </script>

    <script data-spa-router>
    (function() {
        var currentPage = location.pathname;
        var mainContainer = document.querySelector('.index-main-container');

        function updateActiveNav(path) {
            document.querySelectorAll('[data-nav]').forEach(function(a) {
                a.classList.remove('is-active');
                var href = a.getAttribute('href');
                if (href === path || (path !== '/' && href !== '/' && path.startsWith(href))) {
                    a.classList.add('is-active');
                }
            });
        }

        function navigateTo(url, push) {
            if (url === currentPage) return;

            document.dispatchEvent(new CustomEvent('spa:navigate'));

            mainContainer.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--color-muted);gap:8px"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="emoji-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><span>加载中...</span></div>';
            fetch(url, {headers: {'X-Requested-With': 'SPA'}})
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function(html) {
                    // Use a real DOM element (not DOMParser) for reliable parsing
                    var temp = document.createElement('div');
                    temp.style.display = 'none';
                    temp.innerHTML = html;
                    var newMain = temp.querySelector('.index-main-container');
                    if (newMain) {
                        mainContainer.innerHTML = newMain.innerHTML;
                    }
                    // Re-load external scripts first, then execute inline scripts
                    var srcScripts = Array.from(temp.querySelectorAll('script[src]'));
                    var inlineScripts = Array.from(temp.querySelectorAll('script:not([src]):not([data-spa-router])'));
                    var loadPromises = srcScripts.map(function(s) {
                        return new Promise(function(resolve) {
                            var src = s.getAttribute('src');
                            var existing = document.querySelector('script[src="' + src + '"]');
                            if (existing) {
                                resolve();
                                return;
                            }
                            var ns = document.createElement('script');
                            ns.onload = resolve;
                            ns.onerror = resolve;
                            ns.src = src;
                            document.body.appendChild(ns);
                        });
                    });
                    Promise.all(loadPromises).then(function() {
                        inlineScripts.forEach(function(s) {
                            try {
                                var ns = document.createElement('script');
                                ns.textContent = s.textContent;
                                document.body.appendChild(ns);
                                ns.remove();
                            } catch(e) {}
                        });
                    });
                })
                .catch(function() {
                    mainContainer.innerHTML = '<div style="padding:40px;color:var(--color-muted)">加载失败</div>';
                });

            currentPage = url;
            updateActiveNav(url);
            if (push !== false) history.pushState(null, '', url);
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('button')) return;
            var link = e.target.closest('[data-nav]');
            if (!link) return;
            e.preventDefault();
            navigateTo(link.getAttribute('href'));
        });

        window.addEventListener('popstate', function() {
            var url = location.pathname;
            if (url !== currentPage) {
                navigateTo(url, false);
            }
        });
    })();
    </script>
