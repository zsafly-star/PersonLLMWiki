{% extends "base.html" %}

{% block content %}
    <div class="picture-view">
        <div class="picture-container">
            <!-- ═══ Sidebar ═══ -->
            <aside class="picture-sidebar" role="navigation" aria-label="文件夹导航">
                <div class="sidebar-search-box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="folder-search" placeholder="搜索文件夹..." aria-label="搜索文件夹" oninput="filterPictureTree()" />
                    <button class="sidebar-menu-btn" onclick="toggleSidebarMenu(event)" aria-label="新建文件夹" title="新建文件夹">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                    </button>
                    <div class="sidebar-dropdown" id="sidebar-dropdown" role="menu">
                        <button onclick="showNewFolderModal()" role="menuitem">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                            新建文件夹
                        </button>
                    </div>
                </div>
                <ul class="picture-tree-root" id="picture-tree" role="tree" aria-label="图片文件夹">
                    <li class="tree-loading" role="status">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="emoji-spin" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                        <span>加载中...</span>
                    </li>
                </ul>
            </aside>

            <!-- ═══ Content ═══ -->
            <main class="picture-content">
                <div class="content-toolbar">
                    <div class="toolbar-left">
                        <div class="view-toggle" role="radiogroup" aria-label="视图模式">
                            <button class="view-btn active" data-view="grid" title="网格视图" role="radio" aria-checked="true" aria-label="网格视图">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                            </button>
                            <button class="view-btn" data-view="list" title="列表视图" role="radio" aria-checked="false" aria-label="列表视图">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
                            </button>
                        </div>
                        <span class="image-count" id="image-count" aria-live="polite">0</span>
                    </div>
                    <div class="toolbar-right">
                        <button class="toolbar-btn" id="btn-upload" style="display:none" onclick="triggerImageUpload()" title="上传图片" aria-label="上传图片">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            上传
                        </button>
                        <div class="toolbar-more-wrap">
                            <button class="toolbar-btn toolbar-more-btn" onclick="toggleToolbarMenu(event)" title="更多操作" aria-label="更多操作">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                            </button>
                            <div class="toolbar-dropdown" id="toolbar-dropdown" role="menu">
                                <button onclick="enterSelectMode()" role="menuitem">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                    删除图片
                                </button>
                            </div>
                        </div>
                        <div class="select-actions" id="select-actions" style="display:none;">
                            <label class="select-all-label">
                                <input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this.checked)" aria-label="全选图片"> 全选
                            </label>
                            <button class="toolbar-btn toolbar-btn-danger" onclick="confirmDeleteSelected()" aria-label="确认删除选中图片">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                                确认删除 (<span id="selected-count">0</span>)
                            </button>
                            <button class="toolbar-btn" onclick="cancelSelectMode()">取消</button>
                        </div>
                        <input type="file" id="file-upload-input" multiple accept="image/*" style="display:none;" onchange="handleImageUpload(this.files)" aria-label="选择图片文件">
                    </div>
                </div>

                <div class="image-grid-container" id="image-grid" role="region" aria-label="图片列表">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        <p>暂无图片</p>
                        <p class="empty-hint">请先在设置页面配置资源路径，或选择一个文件夹后上传</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="pic-modal-overlay" id="pic-modal-overlay" role="dialog" aria-modal="true" aria-label="图片操作">
        <div class="pic-modal" id="pic-modal-content"></div>
    </div>
{% endblock %}

{% block scripts %}
    <script>
        onPageReady(function() {
            if (typeof loadPicturePage === 'function') loadPicturePage();
        });
    </script>
{% endblock %}
