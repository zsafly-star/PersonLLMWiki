{% extends "base.html" %}

{% block content %}
<div class="ws-page" id="dashboard">

    <!-- ═══ Header: 问候 + 天气 ═══ -->
    <header class="ws-header">
        <div class="ws-header-left">
            <h1 class="ws-greeting">
                <span id="greeting-period">早上好</span>，<span id="user-name">--</span>
            </h1>
            <div class="ws-date-block">
                <div class="ws-date-main">
                    <span id="current-year">--</span>年
                    <span id="current-month">--</span>月
                    <span id="current-day">--</span>日
                </div>
                <div class="ws-date-weekday" id="current-weekday">--</div>
            </div>
        </div>
        <!-- Weather Widget -->
        <div class="ws-weather" id="ws-weather" aria-label="天气信息">
            <div class="ws-weather-default" id="ws-weather-default">
                <img class="ws-weather-icon" id="ws-weather-icon" src="" alt="" />
                <span class="ws-weather-temp" id="ws-weather-temp">--°</span>
                <span class="ws-weather-city" id="ws-weather-city">--</span>
            </div>
            <!-- Hover expand -->
            <div class="ws-weather-expand" id="ws-weather-expand">
                <div class="ws-weather-expand-row">
                    <span class="ws-weather-expand-label">湿度</span>
                    <span class="ws-weather-expand-val" id="ws-weather-humidity">--%</span>
                </div>
                <div class="ws-weather-expand-row">
                    <span class="ws-weather-expand-label">风力</span>
                    <span class="ws-weather-expand-val" id="ws-weather-wind">--</span>
                </div>
                <div class="ws-weather-expand-row">
                    <span class="ws-weather-expand-label">明日</span>
                    <span class="ws-weather-expand-val" id="ws-weather-tomorrow">--° / --°</span>
                </div>
                <div class="ws-weather-expand-row">
                    <span class="ws-weather-expand-label">后天</span>
                    <span class="ws-weather-expand-val" id="ws-weather-dayafter">--° / --°</span>
                </div>
                <a href="/settings" data-nav class="ws-weather-detail-link">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    天气设置
                </a>
            </div>
        </div>
    </header>

    <!-- ═══ Section: 今天要做什么 ═══ -->
    <section class="ws-section" id="ws-section-todos">
        <div class="ws-section-head">
            <h2 class="ws-section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                今天要做什么
            </h2>
        </div>
        <div class="ws-section-body" id="ws-todo-list">
            <div class="ws-skeleton" style="width:65%"></div>
            <div class="ws-skeleton" style="width:80%"></div>
            <div class="ws-skeleton" style="width:50%"></div>
        </div>
        <div class="ws-section-foot" id="ws-todo-foot" style="display:none">
            <a href="/todo" data-nav class="ws-overflow-link">
                还有 <span id="ws-todo-overflow-num">0</span> 项 · 看板查看全部
            </a>
        </div>
    </section>

    <!-- ═══ Section: 值得关注 ═══ -->
    <section class="ws-section" id="ws-section-attention" style="display:none">
        <div class="ws-section-head">
            <h2 class="ws-section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                值得关注
            </h2>
        </div>
        <div class="ws-section-body" id="ws-attention-list"></div>
    </section>

    <!-- ═══ Section: 最近更新 ═══ -->
    <section class="ws-section" id="ws-section-recent">
        <div class="ws-section-head">
            <h2 class="ws-section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                最近更新
            </h2>
        </div>
        <div class="ws-section-body" id="ws-recent-list">
            <div class="ws-skeleton" style="width:70%"></div>
            <div class="ws-skeleton" style="width:60%"></div>
            <div class="ws-skeleton" style="width:55%"></div>
        </div>
    </section>

    <!-- ═══ System Pulse ═══ -->
    <div class="ws-pulse" id="ws-pulse">
        <span class="ws-pulse-item" id="ws-pulse-sync">
            <span class="ws-pulse-dot ws-pulse-dot-on"></span>
            <span class="ws-pulse-text">公共库已同步</span>
        </span>
        <span class="ws-pulse-sep">·</span>
        <span class="ws-pulse-item" id="ws-pulse-mcp">
            <span class="ws-pulse-dot ws-pulse-dot-on"></span>
            <span class="ws-pulse-text">MCP --</span>
        </span>
        <span class="ws-pulse-sep">·</span>
        <span class="ws-pulse-item" id="ws-pulse-scheduler">
            <span class="ws-pulse-dot ws-pulse-dot-on"></span>
            <span class="ws-pulse-text">调度器运行中</span>
        </span>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
var _homeTimeTimer = null;
onPageReady(function() {
    initNavigation();
    loadAvatar();
    loadUsername();
    updateTimeAndGreeting();
    if (_homeTimeTimer) clearInterval(_homeTimeTimer);
    _homeTimeTimer = setInterval(updateTimeAndGreeting, 10000);
    loadWeather();
    loadTodos();
    loadAttention();
    loadRecentUpdates();
    loadSystemPulse();
});
document.addEventListener('spa:navigate', function() {
    if (_homeTimeTimer) { clearInterval(_homeTimeTimer); _homeTimeTimer = null; }
});

/* ═══ 时间 + 问候语 ═══ */
function updateTimeAndGreeting() {
    var now = new Date();
    var h = now.getHours();
    var g = '';
    if (h < 6) g = '夜深了';
    else if (h < 9) g = '早上好';
    else if (h < 12) g = '上午好';
    else if (h < 14) g = '中午好';
    else if (h < 18) g = '下午好';
    else if (h < 22) g = '晚上好';
    else g = '夜深了';
    var el = document.getElementById('greeting-period');
    if (el) el.textContent = g;

    var yearEl = document.getElementById('current-year');
    if (yearEl) yearEl.textContent = now.getFullYear();
    var monthEl = document.getElementById('current-month');
    if (monthEl) monthEl.textContent = now.getMonth() + 1;
    var dayEl = document.getElementById('current-day');
    if (dayEl) dayEl.textContent = now.getDate();
    
    var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    var weekdayEl = document.getElementById('current-weekday');
    if (weekdayEl) weekdayEl.textContent = '星期' + weekdays[now.getDay()];
}

/* ═══ 天气 ═══ */
function loadWeather() {
    fetch('/api/weather/daily')
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code !== 200 || !res.data) {
                fallbackWeather();
                return;
            }
            var d = res.data;
            var today = d.forecast && d.forecast[0];
            var tomorrow = d.forecast && d.forecast[1];
            var dayafter = d.forecast && d.forecast[2];

            document.getElementById('ws-weather-city').textContent = d.city || '--';
            if (today) {
                document.getElementById('ws-weather-temp').textContent = today.temp_max + '°';
                var icon = document.getElementById('ws-weather-icon');
                if (icon) {
                    icon.src = today.icon_path || '';
                    icon.alt = today.text_day || '';
                }
                document.getElementById('ws-weather-humidity').textContent = (today.humidity || '--') + '%';
                document.getElementById('ws-weather-wind').textContent = 
                    (today.wind_dir_day || '') + ' ' + (today.wind_scale_day || '') + '级';
            }
            if (tomorrow) {
                document.getElementById('ws-weather-tomorrow').textContent = 
                    tomorrow.temp_max + '° / ' + tomorrow.temp_min + '° ' + (tomorrow.text_day || '');
            }
            if (dayafter) {
                document.getElementById('ws-weather-dayafter').textContent = 
                    dayafter.temp_max + '° / ' + dayafter.temp_min + '° ' + (dayafter.text_day || '');
            }
        })
        .catch(function() { fallbackWeather(); });
}

function fallbackWeather() {
    document.getElementById('ws-weather-temp').textContent = '--°';
    document.getElementById('ws-weather-city').textContent = '--';
}

/* ═══ 今日待办 ═══ */
function loadTodos() {
    fetch('/api/todos')
        .then(function(r) { return r.json(); })
        .then(function(res) {
            var el = document.getElementById('ws-todo-list');
            if (res.code !== 200 || !res.data) {
                el.innerHTML = '<div class="ws-empty">今天没有待办任务，享受清闲。</div>';
                return;
            }
            var active = res.data.filter(function(i) {
                return i.status === 'todo' || i.status === 'doing' || i.status === 'inbox';
            });
            if (active.length === 0) {
                el.innerHTML = '<div class="ws-empty">今天没有待办任务，享受清闲。</div>';
                return;
            }

            // 按 priority 排序（high 优先），最多 6 条
            var priorityOrder = { high: 0, normal: 1, low: 2 };
            active.sort(function(a, b) {
                return (priorityOrder[a.priority] || 1) - (priorityOrder[b.priority] || 1);
            });
            var visible = active.slice(0, 6);
            var overflow = active.length - 6;

            el.innerHTML = visible.map(function(item) {
                var badge = getDeadlineBadge(item.priority);
                return '<label class="ws-todo-row">'
                     + '<input type="checkbox" onchange="toggleTodo(' + item.id + ',this.checked)" />'
                     + '<span class="ws-todo-check"></span>'
                     + '<span class="ws-todo-text">' + escHtml(item.title) + '</span>'
                     + (badge ? '<span class="ws-todo-badge ' + badge.cls + '">' + badge.text + '</span>' : '')
                     + '</label>';
            }).join('');

            var foot = document.getElementById('ws-todo-foot');
            if (overflow > 0) {
                foot.style.display = 'block';
                document.getElementById('ws-todo-overflow-num').textContent = overflow;
            } else {
                foot.style.display = 'none';
            }
        })
        .catch(function() {
            document.getElementById('ws-todo-list').innerHTML = '<div class="ws-empty">加载失败</div>';
        });
}

function getDeadlineBadge(priority) {
    if (priority === 'high') return { text: '今天到期', cls: 'ws-todo-badge-today' };
    if (priority === 'low') return { text: '无截止', cls: 'ws-todo-badge-none' };
    return { text: '本周内', cls: 'ws-todo-badge-week' };
}

function toggleTodo(id, done) {
    fetch('/api/todos/' + id, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ status: done ? 'done' : 'todo' })
    }).then(function() { loadTodos(); });
}

/* ═══ 值得关注 ═══ */
function loadAttention() {
    fetch('/api/home/attention')
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code !== 200 || !res.data) return;
            var items = res.data.items || [];
            if (items.length === 0) return;

            var section = document.getElementById('ws-section-attention');
            section.style.display = 'block';

            var el = document.getElementById('ws-attention-list');
            el.innerHTML = items.map(function(item) {
                var icon = getAttentionIcon(item.type);
                return '<a href="' + escAttr(item.link) + '" data-nav class="ws-attention-row">'
                     + '<span class="ws-attention-icon">' + icon + '</span>'
                     + '<span class="ws-attention-text">' + escHtml(item.text) + '</span>'
                     + '<span class="ws-attention-action">' + escHtml(item.action_label || '查看') + '</span>'
                     + '<svg class="ws-attention-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'
                     + '</a>';
            }).join('');
        })
        .catch(function() { /* silent fail for attention */ });
}

function getAttentionIcon(type) {
    switch (type) {
        case 'pending': return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>';
        case 'new_concepts': return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
        case 'build_error': return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
        default: return '';
    }
}

/* ═══ 最近更新 ═══ */
function loadRecentUpdates() {
    fetch('/api/wiki/pages?limit=6')
        .then(function(r) { return r.json(); })
        .then(function(res) {
            var el = document.getElementById('ws-recent-list');
            if (res.code !== 200 || !res.data || !res.data.pages || res.data.pages.length === 0) {
                el.innerHTML = '<div class="ws-empty">知识库还没有内容，去 AI 对话中开始积累吧。</div>';
                return;
            }
            var pages = res.data.pages.slice(0, 5);
            el.innerHTML = pages.map(function(p) {
                var timeAgo = relativeTime(p.updated_at);
                var sourceBadge = p.source === 'common'
                    ? '<span class="ws-source-badge ws-source-common">公共</span>'
                    : '';
                return '<a href="/wiki?page=' + encodeURIComponent(p.slug) + '" data-nav class="ws-recent-row">'
                     + '<span class="ws-recent-title">' + escHtml(p.title) + sourceBadge + '</span>'
                     + '<span class="ws-recent-time">' + timeAgo + '</span>'
                     + '</a>';
            }).join('');
        })
        .catch(function() {
            document.getElementById('ws-recent-list').innerHTML = '<div class="ws-empty">加载失败</div>';
        });
}

function relativeTime(isoStr) {
    if (!isoStr) return '';
    try {
        var then = new Date(isoStr);
        var now = new Date();
        var diff = Math.floor((now - then) / 1000);
        if (diff < 60) return '刚刚';
        if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
        if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
        if (diff < 172800) return '昨天';
        return Math.floor(diff / 86400) + ' 天前';
    } catch(e) { return ''; }
}

/* ═══ 系统脉搏 ═══ */
function loadSystemPulse() {
    // Dashboard API
    fetch('/api/dashboard')
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code !== 200 || !res.data) return;
            var sync = res.data.sync || {};
            
            // 公共库同步
            setPulseItem('ws-pulse-sync', sync.last_sync ? true : false,
                sync.last_sync ? '公共库已同步' : '公共库未同步');

            // MCP
            var servers = res.data.mcp ? (res.data.mcp.servers || []) : [];
            var connected = servers.filter(function(s){return s.connected;}).length;
            setPulseItem('ws-pulse-mcp', connected > 0, 'MCP ' + connected + '/' + servers.length);
        })
        .catch(function() {});

    // Scheduler API
    fetch('/api/scheduler/status')
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code !== 200 || !res.data) return;
            setPulseItem('ws-pulse-scheduler', res.data.running,
                res.data.running ? '调度器运行中' : '调度器已停止');
        })
        .catch(function() {});
}

function setPulseItem(id, on, text) {
    var el = document.getElementById(id);
    if (!el) return;
    var dot = el.querySelector('.ws-pulse-dot');
    if (dot) {
        dot.className = 'ws-pulse-dot' + (on ? ' ws-pulse-dot-on' : ' ws-pulse-dot-off');
    }
    var textEl = el.querySelector('.ws-pulse-text');
    if (textEl) {
        textEl.textContent = text;
    }
}

/* ═══ 工具函数 ═══ */
function escHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function escAttr(str) {
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
{% endblock %}
