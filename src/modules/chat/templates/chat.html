{% extends "base.html" %}

{% block content %}
<div class="chat-page">
    <div class="chat-left">
        <div class="chat-left-top">
            <button class="chat-new-btn" onclick="createNewSession()" aria-label="新建对话">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg> 新建对话
            </button>
        </div>
        <div class="chat-history" id="chat-history">
            <div class="chat-history-empty">
                <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:8px; opacity:0.4"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>
                <span>暂无历史对话</span>
            </div>
        </div>
    </div>
    <div class="chat-main">
    <div class="chat-right" id="chat-right">
        <div class="chat-welcome" id="chat-welcome">
            <div class="chat-welcome-greeting">你好，有什么可以帮你的？</div>
            <div class="chat-welcome-sub">我是你的 AI 助手，随时为你服务</div>
        </div>
        <div class="chat-header" id="chat-header" style="display:none;">
            <div class="chat-header-title">
                <span id="chat-header-name">新对话</span>
                <span class="chat-header-model" id="chat-header-model">加载中</span>
            </div>
            <div class="chat-header-actions">
                <button class="panel-sidebar-toggle" id="panel-toggle-btn" onclick="toggleRightPanel()" title="切换预览面板" aria-label="切换预览面板">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
                </button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages" style="display:none;">
            <div class="chat-messages-scroll" id="chat-messages-scroll"></div>
        </div>
        <div class="chat-input-bar" id="chat-input-bar" style="display:block;">
            <div class="chat-uploaded-files" id="chat-uploaded-files"></div>
            <div class="chat-input-row">
                <textarea id="chat-input" placeholder="今天帮你做些什么？ @ 引用对话文件，/ 调用技能与指令" rows="1" onkeydown="handleKey(event)" oninput="autoH(this)" aria-label="消息输入"></textarea>
                <div class="chat-input-actions">
                    <input type="file" id="chat-file-input" style="display:none" multiple />
                    <div class="chat-input-left">
                    <div class="chat-plus-wrap">
                        <button class="chat-input-plus" onclick="toggleAddMenu(event)" title="添加文件" aria-label="添加文件">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                        </button>
                        <div class="chat-plus-dropdown" id="chat-plus-dropdown">
                            <div class="dd-head">添加文件</div>
                            <div class="dd-item" data-action="add-file" data-type="local">
                                <svg class="dd-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                                <span>本地文件</span>
                            </div>
                            <div class="dd-item" data-action="add-file" data-type="kb">
                                <svg class="dd-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                                <span>知识库文件</span>
                            </div>
                        </div>
                    </div>
                    <div class="chat-mode-wrap">
                        <button class="chat-mode-btn" id="chat-mode-btn" onclick="toggleModeMenu(event)" title="切换模式" aria-label="切换模式">
                            <svg id="chat-mode-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                            <span id="chat-mode-label">快速</span>
                            <svg class="chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <div class="chat-mode-dropdown" id="chat-mode-dropdown">
                            <div class="dd-head">对话模式</div>
                            <div class="dd-item active" data-action="set-mode" data-mode="quick">
                                <svg class="dd-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                <span>快速</span>
                            </div>
                            <div class="dd-item" data-action="set-mode" data-mode="expert">
                                <svg class="dd-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 2 3 6 3s6-2 6-3v-5"/></svg>
                                <span>专家</span>
                            </div>
                        </div>
                    </div>
                    </div>
                    <div class="chat-input-right">
                        <div class="chat-model-wrap">
                            <button class="chat-model-btn" id="chat-model-btn" onclick="toggleModelMenu(event)" title="切换模型" aria-label="切换模型">
                                <span class="model-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" stroke="none">A</text></svg>
                                </span>
                                <span id="chat-model-label">Auto</span>
                                <svg class="chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                            </button>
                            <div class="chat-model-dropdown" id="chat-model-dropdown">
                                <div class="dd-head">选择模型</div>
                            </div>
                        </div>
                        <button class="chat-voice-btn" id="chat-voice-btn" title="语音输入" aria-label="语音输入">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                        </button>
                        <button class="chat-send-btn" id="chat-send-btn" onclick="sendMsg()" aria-label="发送"></button>
                    </div>
                </div>
            </div>
        </div>
        <!-- KB File Browser Modal -->
        <div class="kb-browser-overlay" id="kb-browser-overlay" onclick="closeKbBrowser()"></div>
        <div class="kb-browser" id="kb-browser">
            <div class="kb-browser-header">
                <button class="kb-browser-back" id="kb-browser-back" onclick="kbBrowseUp()" disabled aria-label="上级">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="kb-browser-breadcrumb" id="kb-browser-breadcrumb">知识库</div>
                <button class="kb-browser-close" onclick="closeKbBrowser()" aria-label="关闭">&times;</button>
            </div>
            <div class="kb-browser-body" id="kb-browser-body"></div>
        </div>
    </div>
    <div class="panel-resize-handle" id="panel-resize-handle"></div>
    <!-- ===== Right Panel ===== -->
    <div class="chat-right-panel collapsed" id="chat-right-panel">
        <div class="panel-header">
            <span class="panel-title" id="panel-doc-title">文档预览</span>
            <button class="panel-download-btn" id="panel-download-btn" title="下载文件" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
        </div>
        <div class="panel-body">
            <div class="panel-empty" id="panel-doc-empty">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <p>点击文档链接预览</p>
            </div>
            <div class="panel-doc-content md-body" id="panel-doc-content" style="display:none;"></div>
        </div>
    </div>
    </div><!-- /chat-main -->
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/modules/chat.js') }}"></script>
<script>
// SPA 路由切换到本页时重新初始化（src 脚本不会重复执行，需内联调用）
onPageReady(function() {
    if (typeof initChat === 'function') initChat();
});
</script>
{% endblock %}
