{% extends "base.html" %}

{% block content %}
    <div class="article-main-view">
        <div class="article-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-search-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="tree-search" placeholder="搜索文件或文件夹..." oninput="filterDocTree()" />
                </div>
                <div class="sidebar-menu-wrapper">
                    <button class="sidebar-menu-btn" onclick="toggleSidebarMenu(event)" title="更多选项" aria-label="更多选项">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                    </button>
                    <div class="sidebar-dropdown" id="sidebar-dropdown">
                        <button onclick="showNewKnowledgeBaseModal()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg> 新建知识库
                        </button>
                        <div class="sidebar-dropdown-sep"></div>
                        <button onclick="refreshDocTree()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> 刷新
                        </button>
                    </div>
                </div>
            </div>
            <div class="sidebar-tree" id="doc-tree">
                <div class="tree-loading" id="tree-loading">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="emoji-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                    <span>加载中...</span>
                </div>
                <div class="tree-empty" id="tree-empty" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                    <span>暂无目录</span>
                </div>
                <ul class="tree-list" id="tree-list" style="display: none;"></ul>
            </div>
        </div>
        <div class="article-content">
            <div class="content-body" id="article-content">
                <div class="empty-content">
                    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-content-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>
                    <p>请在左侧选择一篇文章</p>
                </div>
            </div>
            <div class="article-toc" id="article-toc">
                <div class="toc-list" id="toc-list"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-folder-settings">
        <div class="modal-content folder-settings-modal">
            <div class="modal-header">
                <h3>知识库</h3>
                <button class="btn-close" onclick="closeFolderSettings()" title="关闭" aria-label="关闭">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="icon-picker-hover" id="icon-picker">
                        <div class="icon-preview" id="icon-preview"></div>
                        <div class="icon-dropdown" id="icon-dropdown">
                            <div class="icon-grid" id="icon-grid"></div>
                        </div>
                    </div>
                    <div class="form-group form-group-flex">
                        <label>名称</label>
                        <input type="text" class="form-input" id="folder-name" placeholder="文件夹名称" />
                    </div>
                </div>
                <div class="form-group">
                    <label>简介</label>
                    <textarea class="form-textarea" id="folder-description" rows="3" placeholder="文件夹简介..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeFolderSettings()">取消</button>
                <button class="btn btn-primary" onclick="saveFolderSettings()">保存</button>
            </div>
        </div>
    </div>


    <!-- Wiki 概念抽屉（侧边滑出，不离开当前文章页） -->
    <div class="wiki-drawer-overlay" id="wiki-drawer-overlay" onclick="if(event.target===this)closeWikiDrawer()">
        <div class="wiki-drawer-panel" id="wiki-drawer-panel">
            <div class="wiki-drawer-header">
                <span class="wiki-drawer-breadcrumb">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    概念
                </span>
                <button class="wiki-drawer-close" onclick="closeWikiDrawer()" title="关闭" aria-label="关闭">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="wiki-drawer-body" id="wiki-drawer-body"></div>
        </div>
    </div>

{% endblock %}

{% block scripts %}
<script>
if (typeof loadDocTree === 'function') {
    loadArticleRootPath();
    loadDocTree();
}
</script>
{% endblock %}
