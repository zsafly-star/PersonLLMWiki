{% extends "base.html" %}

{% block content %}
    <div class="note-view">
        <div class="view-header">
            <h2>笔记管理</h2>
            <button class="btn btn-primary" onclick="addNote()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 添加笔记
            </button>
        </div>
        <div class="note-container" id="note-list">
            <div class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                <p>暂无笔记</p>
            </div>
        </div>
    </div>

    <style>
        .note-card { display:flex; flex-direction:column; gap:6px; padding:14px 16px; border:1px solid var(--color-border,#eee); border-radius:10px; background:var(--color-bg,#fff); cursor:pointer; margin-bottom:10px; transition:box-shadow .15s ease, border-color .15s ease; }
        .note-card:hover { border-color:var(--color-primary,#0d9488); box-shadow:0 2px 8px rgba(0,0,0,.06); }
        .note-title { font-size:15px; font-weight:600; margin:0; color:var(--color-text,#1a1a1a); }
        .note-meta { font-size:12px; color:var(--color-muted,#6B7280); }
    </style>
{% endblock %}

{% block scripts %}
<script>
(function() {
    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatTime(ts) {
        if (!ts) return '';
        var ms = ts < 1e12 ? ts * 1000 : ts;
        var d = new Date(ms);
        if (isNaN(d.getTime())) return '';
        function p(n) { return String(n).padStart(2, '0'); }
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
            + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    // 递归扁平化文章文件树，取出所有 .md 文件
    function flattenFiles(nodes, out) {
        out = out || [];
        (nodes || []).forEach(function(n) {
            if (n.type === 'file') {
                out.push(n);
            } else if (n.children && n.children.length) {
                flattenFiles(n.children, out);
            }
        });
        return out;
    }

    function renderNotes(files) {
        var container = document.getElementById('note-list');
        if (!container) return;
        if (!files || files.length === 0) {
            container.innerHTML =
                '<div class="empty-state">' +
                '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>' +
                '<p>暂无笔记</p>' +
                '</div>';
            return;
        }

        var html = '';
        files.forEach(function(f) {
            var title = escapeHtml(String(f.name || '').replace(/\.md$/, '')) || '无标题';
            var time = formatTime(f.modified);
            html +=
                '<div class="note-card" data-path="' + escapeHtml(f.path) + '">' +
                '<h3 class="note-title">' + title + '</h3>' +
                (time ? '<div class="note-meta">' + escapeHtml(time) + '</div>' : '') +
                '</div>';
        });
        container.innerHTML = html;
    }

    function bindListClick() {
        var container = document.getElementById('note-list');
        if (!container || container._noteBound) return;
        container._noteBound = true;
        container.addEventListener('click', function(e) {
            var card = e.target.closest('.note-card');
            if (card && card.dataset.path) {
                window.location.href = '/article?path=' + encodeURIComponent(card.dataset.path);
            }
        });
    }

    // 文章文件树不含修改时间，逐文件补充 modified 字段
    function enrichModified(files) {
        return Promise.all(files.map(function(f) {
            return fetch('/api/article/content?path=' + encodeURIComponent(f.path))
                .then(function(r) { return r.json(); })
                .then(function(cr) {
                    if (cr.code === 200 && cr.data && cr.data.modified) {
                        f.modified = cr.data.modified;
                    }
                    return f;
                })
                .catch(function() { return f; });
        }));
    }

    function loadNotes() {
        fetch('/api/article/tree')
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var tree = (res.code === 200 && res.data) ? res.data : [];
                return enrichModified(flattenFiles(tree));
            })
            .then(renderNotes)
            .catch(function() { renderNotes([]); });
    }

    window.addNote = function() {
        fetch('/api/article/init-paths', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            var root = res.data && res.data.article_path;
            if (!root) throw new Error('无法获取文章根目录');
            return fetch('/api/article/document', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folder_path: root })
            });
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code === 200 && res.data && res.data.path) {
                window.location.href = '/article?path=' + encodeURIComponent(res.data.path);
            } else {
                showToast('创建笔记失败');
            }
        })
        .catch(function() { showToast('创建笔记失败'); });
    };

    bindListClick();
    loadNotes();
})();
</script>
{% endblock %}
