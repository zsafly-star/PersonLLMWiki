{% extends "base.html" %}

{% block content %}
<div class="task-page" id="task-page">

    <!-- ═══ Top Bar ═══ -->
    <header class="task-top">
        <div class="task-top-left">
            <h1 class="task-h1">任务</h1>
            <span class="task-progress-pill" id="progress-pill">
                <svg width="14" height="14" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="15" fill="none" stroke="var(--color-border)" stroke-width="4"/>
                    <circle id="progress-circle" cx="18" cy="18" r="15" fill="none" stroke="var(--color-primary)" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 18 18)" style="transition: stroke-dashoffset 600ms cubic-bezier(0.4,0,0.2,1)"/>
                </svg>
                <span id="progress-text">0 / 0</span>
            </span>
        </div>
        <div class="task-top-right">
            <button class="task-ghost-btn" onclick="clearDone()" title="清除已完成/已取消" aria-label="清除">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </div>
    </header>

    <!-- ═══ Quick Add ═══ -->
    <div class="task-add-zone">
        <div class="task-add-row" id="task-add-row">
            <button class="task-pri-pill" id="pri-pill" onclick="cyclePriority()" aria-label="切换优先级">
                <span class="task-pri-dot" id="pri-dot"></span>
                <span id="pri-label">普通</span>
            </button>
            <input type="text" id="todo-input" placeholder="添加任务，回车确认…" class="task-add-input"
                   onkeydown="if(event.key==='Enter')addTodo()" />
            <button class="task-add-submit" onclick="addTodo()" aria-label="添加">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
        </div>
    </div>

    <!-- ═══ Kanban Board ═══ -->
    <div class="kanban-scroll">
        <div class="kanban">
            <!-- Col: 收集箱 -->
            <div class="kanban-col" data-status="inbox">
                <div class="kanban-col-head">
                    <span class="kanban-dot kanban-dot-inbox"></span>
                    <span class="kanban-col-name">收集箱</span>
                    <span class="kanban-col-badge" id="count-inbox">0</span>
                </div>
                <div class="kanban-col-body" id="col-inbox"></div>
            </div>
            <!-- Col: 待办 -->
            <div class="kanban-col" data-status="todo">
                <div class="kanban-col-head">
                    <span class="kanban-dot kanban-dot-todo"></span>
                    <span class="kanban-col-name">待办</span>
                    <span class="kanban-col-badge" id="count-todo">0</span>
                </div>
                <div class="kanban-col-body" id="col-todo"></div>
            </div>
            <!-- Col: 进行中 -->
            <div class="kanban-col" data-status="doing">
                <div class="kanban-col-head">
                    <span class="kanban-dot kanban-dot-doing"></span>
                    <span class="kanban-col-name">进行中</span>
                    <span class="kanban-col-badge" id="count-doing">0</span>
                </div>
                <div class="kanban-col-body" id="col-doing"></div>
            </div>
            <!-- Col: 已完成 -->
            <div class="kanban-col" data-status="done">
                <div class="kanban-col-head">
                    <span class="kanban-dot kanban-dot-done"></span>
                    <span class="kanban-col-name">已完成</span>
                    <span class="kanban-col-badge" id="count-done">0</span>
                </div>
                <div class="kanban-col-body" id="col-done"></div>
            </div>
            <!-- Col: 已取消 -->
            <div class="kanban-col kanban-col-muted" data-status="cancelled">
                <div class="kanban-col-head">
                    <span class="kanban-dot kanban-dot-cancelled"></span>
                    <span class="kanban-col-name">已取消</span>
                    <span class="kanban-col-badge" id="count-cancelled">0</span>
                </div>
                <div class="kanban-col-body" id="col-cancelled"></div>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
onPageReady(function() {
    currentPriority = 'normal';
    loadTodos();

    // Keyboard shortcut: / focuses input
    document.addEventListener('keydown', function(e) {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            document.getElementById('todo-input').focus();
        }
    });
});

var allTodos = [];
var currentPriority = 'normal';

var priConfig = {
    high:   { color: '#EF4444', label: '高优', order: 0 },
    normal: { color: '#0D9488', label: '普通', order: 1 },
    low:    { color: '#94A3B8', label: '低优', order: 2 }
};

// Column order config
var colOrder = ['inbox', 'todo', 'doing', 'done', 'cancelled'];

var colConfig = {
    inbox:     { name: '收集箱', color: '#94A3B8', next: 'todo' },
    todo:      { name: '待办',   color: '#0D9488', next: 'doing' },
    doing:     { name: '进行中', color: '#D97706', next: 'done' },
    done:      { name: '已完成', color: '#059669', next: null },
    cancelled: { name: '已取消', color: '#94A3B8', next: null }
};

/* ═══ Priority Cycling ═══ */
function cyclePriority() {
    var seq = ['normal', 'high', 'low'];
    var idx = seq.indexOf(currentPriority);
    currentPriority = seq[(idx + 1) % 3];
    updatePriPill();
}

function updatePriPill() {
    var c = priConfig[currentPriority];
    document.getElementById('pri-dot').style.background = c.color;
    document.getElementById('pri-label').textContent = c.label;
    document.getElementById('pri-pill').style.color = c.color;
    document.getElementById('pri-pill').style.background = c.color + '15';
}

/* ═══ Load ═══ */
function loadTodos() {
    fetch('/api/todos')
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.code === 200) {
                allTodos = result.data || [];
                updatePriPill();
                updateStats();
                renderBoard();
            }
        });
}

function updateStats() {
    var total = allTodos.length;
    var done = allTodos.filter(function(i) { return i.status === 'done'; }).length;
    var cancelled = allTodos.filter(function(i) { return i.status === 'cancelled'; }).length;

    // Progress pill
    var active = total - cancelled;
    var pct = active > 0 ? Math.round(done / active * 100) : 0;
    var circle = document.getElementById('progress-circle');
    var circumference = 94.2;
    circle.style.strokeDashoffset = circumference - (circumference * pct / 100);
    document.getElementById('progress-text').textContent = done + ' / ' + active;
}

/* ═══ Board Rendering ═══ */
function renderBoard() {
    var cols = { inbox: [], todo: [], doing: [], done: [], cancelled: [] };
    allTodos.forEach(function(i) {
        var s = i.status || 'inbox';
        if (!cols[s]) s = 'inbox';
        cols[s].push(i);
    });

    colOrder.forEach(function(status) {
        var body = document.getElementById('col-' + status);
        var countEl = document.getElementById('count-' + status);
        if (!body) return;

        countEl.textContent = cols[status].length;

        // Sort within column by priority
        cols[status].sort(function(a, b) {
            var pa = (priConfig[a.priority] || priConfig.normal).order;
            var pb = (priConfig[b.priority] || priConfig.normal).order;
            return pa - pb;
        });

        if (cols[status].length === 0) {
            body.innerHTML = '<div class="kanban-empty">' + getEmptyHint(status) + '</div>';
        } else {
            body.innerHTML = cols[status].map(function(item, idx) {
                return renderCard(item, status, idx);
            }).join('');
        }

        // Drop zone
        body.ondragover = function(e) { e.preventDefault(); this.classList.add('kanban-drop'); };
        body.ondragleave = function() { this.classList.remove('kanban-drop'); };
        body.ondrop = function(e) {
            e.preventDefault();
            this.classList.remove('kanban-drop');
            var id = e.dataTransfer.getData('text/plain');
            if (id) moveTodo(parseInt(id), status);
        };
    });
}

function getEmptyHint(status) {
    var hints = {
        inbox: '新任务会出现在这里',
        todo: '拖动收集箱的任务到这里',
        doing: '准备开工吧',
        done: '还沒有完成的任务',
        cancelled: '不想做的任务丢这里'
    };
    return hints[status] || '';
}

function renderCard(item, status, idx) {
    var c = priConfig[item.priority] || priConfig.normal;
    var isDone = status === 'done';
    var isCancelled = status === 'cancelled';
    var agentBadge = item.source === 'agent' ? '<span class="task-badge-ai">AI</span>' : '';
    var wikiLink = item.related_slug
        ? '<a href="/wiki?page=' + item.related_slug + '" class="task-wiki-link" data-nav>关联知识</a>'
        : '';
    var textClass = isCancelled ? 'kanban-text-cancelled' : (isDone ? 'kanban-text-done' : '');

    return '<div class="kanban-card" data-id="' + item.id + '" draggable="true" '
         + 'ondragstart="event.dataTransfer.setData(\'text/plain\',' + item.id + '); this.classList.add(\'kanban-dragging\')" '
         + 'ondragend="this.classList.remove(\'kanban-dragging\')" '
         + 'style="animation-delay:' + (idx * 25) + 'ms">'
         + '<div class="kanban-card-rail" style="background:' + c.color + '"></div>'
         + '<div class="kanban-card-body">'
         + '<div class="kanban-card-text ' + textClass + '" ondblclick="editInline(' + item.id + ', this)">' + escHtml(item.title) + '</div>'
         + wikiLink
         + '<div class="kanban-card-foot">'
         + agentBadge
         + '<span class="kanban-card-pri" style="color:' + c.color + '">' + c.label + '</span>'
         + renderActions(item.id, status)
         + '</div>'
         + '</div>'
         + '</div>';
}

function renderActions(id, status) {
    var html = '<div class="kanban-actions">';
    // Forward arrow (next stage)
    var next = colConfig[status] ? colConfig[status].next : null;
    if (next) {
        html += '<button class="kanban-act-btn kanban-act-next" onclick="moveTodo(' + id + ',\'' + next + '\')" title="移到' + colConfig[next].name + '">'
              + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>'
              + '</button>';
    }
    // Cancel button (only for non-terminal statuses)
    if (status !== 'cancelled' && status !== 'done') {
        html += '<button class="kanban-act-btn kanban-act-cancel" onclick="cancelTodo(' + id + ')" title="取消">'
              + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>'
              + '</button>';
    }
    // Restore button (for cancelled/done items)
    if (status === 'cancelled') {
        html += '<button class="kanban-act-btn kanban-act-restore" onclick="moveTodo(' + id + ',\'todo\')" title="恢复">'
              + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>'
              + '</button>';
    }
    // Delete
    html += '<button class="kanban-act-btn kanban-act-del" onclick="deleteTodo(' + id + ')" title="删除">'
          + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
          + '</button>';
    html += '</div>';
    return html;
}

/* ═══ Inline Edit ═══ */
function editInline(id, span) {
    var oldText = span.textContent;
    var input = document.createElement('input');
    input.type = 'text';
    input.value = oldText;
    input.className = 'task-inline-edit';
    input.style.width = '100%';
    span.replaceWith(input);
    input.focus();
    input.select();

    function save() {
        var newText = input.value.trim();
        if (newText && newText !== oldText) {
            fetch('/api/todos/' + id, {
                method: 'PUT', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title: newText })
            }).then(function() { loadTodos(); });
        } else {
            loadTodos();
        }
    }
    input.addEventListener('blur', save);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') { input.value = oldText; loadTodos(); }
    });
}

/* ═══ Actions ═══ */
function addTodo() {
    var input = document.getElementById('todo-input');
    var title = input.value.trim();
    if (!title) return;

    var row = document.getElementById('task-add-row');
    row.classList.add('task-add-flash');

    fetch('/api/todos', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ title: title, priority: currentPriority, status: 'inbox' })
    }).then(function(r) { return r.json(); }).then(function(res) {
        if (res.code === 200) {
            input.value = '';
            currentPriority = 'normal';
            updatePriPill();
            loadTodos();
            setTimeout(function() { row.classList.remove('task-add-flash'); }, 400);
        }
    });
}

function moveTodo(id, status) {
    fetch('/api/todos/' + id, {
        method: 'PUT', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ status: status })
    }).then(function() { loadTodos(); });
}

function cancelTodo(id) {
    moveTodo(id, 'cancelled');
}

function deleteTodo(id) {
    var el = document.querySelector('[data-id="' + id + '"]');
    if (el) {
        el.style.transition = 'opacity 200ms ease, transform 200ms ease';
        el.style.opacity = '0';
        el.style.transform = 'translateX(-20px)';
    }
    setTimeout(function() {
        fetch('/api/todos/' + id, { method: 'DELETE' }).then(function() { loadTodos(); });
    }, 180);
}

function clearDone() {
    fetch('/api/todos/clear-done', { method: 'POST' }).then(function() { loadTodos(); });
}

function escHtml(str) { var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
</script>
{% endblock %}
