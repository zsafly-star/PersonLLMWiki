{% extends "base.html" %}

{% block content %}
<div class="am-page" id="am-page">

    <!-- ═══ Top Bar ═══ -->
    <header class="am-top">
        <div class="am-top-left">
            <h1 class="am-h1">任务中心</h1>
        </div>
    </header>

    <div class="tk-layout">

        <!-- ═══ 左栏：新建 + 任务列表 ═══ -->
        <div class="tk-col">
            <section class="am-card">
                <div class="am-card-head">
                    <h2 class="am-card-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                        新建任务
                    </h2>
                </div>
                <div class="am-form-group">
                    <label class="am-form-label">场景</label>
                    <select class="am-form-input" id="tk-new-scene"></select>
                </div>
                <div class="am-form-group">
                    <label class="am-form-label">标题（可选）</label>
                    <input type="text" class="am-form-input" id="tk-new-title" placeholder="例如：实现 TODO 看板">
                </div>
                <div class="am-form-group">
                    <label class="am-form-label">任务目标</label>
                    <textarea class="am-form-textarea" id="tk-new-goal" rows="3" placeholder="描述你想完成的事情，越具体越好…"></textarea>
                </div>
                <div class="am-form-group">
                    <label class="am-form-label">工作空间（可选）</label>
                    <div class="tk-ws-input-row">
                        <input type="text" class="am-form-input" id="tk-new-workspace" placeholder="电脑文件夹路径，留空自动创建">
                        <button type="button" class="tk-ws-pick-btn" onclick="openWorkspacePicker()" title="浏览选择文件夹">+</button>
                    </div>
                    <div class="am-form-hint">已有项目填其绝对路径，或点「+」选择；留空则在用户目录下自动新建空文件夹</div>
                </div>
                <button class="am-btn-primary" id="tk-create-btn" onclick="createInstance()">启动任务</button>
            </section>

            <section class="am-card">
                <div class="am-card-head">
                    <h2 class="am-card-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
                        任务列表
                    </h2>
                </div>
                <div class="tk-instance-list" id="tk-instance-list">
                    <div class="am-loading">加载中…</div>
                </div>
            </section>
        </div>

        <!-- ═══ 右栏：任务详情 ═══ -->
        <div class="tk-col">
            <section class="am-card" id="tk-detail-card">
                <div id="tk-detail">
                    <div class="tk-empty">选择左侧任务查看详情</div>
                </div>
            </section>
        </div>

    </div>
</div>

<!-- ═══ 工作空间选择弹窗 ═══ -->
<div class="tk-modal-mask" id="tk-ws-modal" style="display:none">
    <div class="tk-modal">
        <div class="tk-modal-head">
            <span>选择工作空间文件夹</span>
            <span class="tk-modal-close" onclick="closeWorkspacePicker()">×</span>
        </div>
        <div class="tk-modal-body">
            <div class="tk-ws-pick-toolbar">
                <button type="button" class="am-btn-ghost am-btn-xs" onclick="wsPickerUp()">上一级</button>
                <button type="button" class="am-btn-primary am-btn-xs" onclick="wsPickerSelect()">选择此文件夹</button>
            </div>
            <div class="tk-ws-pick-path" id="tk-ws-pick-path"></div>
            <div class="tk-ws-pick-list" id="tk-ws-pick-list"><div class="tk-empty">加载中…</div></div>
            <div class="tk-ws-pick-new">
                <input type="text" class="am-form-input" id="tk-ws-new-name" placeholder="新文件夹名">
                <button type="button" class="am-btn-ghost am-btn-xs" onclick="wsPickerMkdir()">新建</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
onPageReady(function() {
    loadScenarios();
    loadInstances();
});

var _scenarios = [];
var _instances = [];
var _selectedTaskId = null;
var _pollTimer = null;
var _wsTaskId = null;
var _wsPath = '';
var _wsData = null;
var _pickerPath = '';
var _pickerParent = null;

function esc(str) {
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
}

function _fmtTime(isoStr) {
    if (!isoStr) return '—';
    try {
        var d = new Date(isoStr + 'Z');
        var p = function(n) { return n < 10 ? '0' + n : n; };
        return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) { return isoStr; }
}

function _statusLabel(state) {
    var map = {
        running: '执行中', awaiting_user: '待确认', done: '已完成',
        failed: '失败', paused: '已暂停'
    };
    return map[state] || state;
}

/* ═══ 场景下拉 ═══ */
function loadScenarios() {
    fetch('/api/tasks/scenarios')
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.code !== 200) return;
            _scenarios = result.data || [];
            var sel = document.getElementById('tk-new-scene');
            if (!sel) return;
            sel.innerHTML = _scenarios.map(function(s) {
                return '<option value="' + esc(s.name) + '">' + esc(s.label) + '</option>';
            }).join('');
        })
        .catch(function() {});
}

/* ═══ 任务实例 ═══ */
function loadInstances() {
    fetch('/api/tasks/instances')
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.code !== 200) return;
            _instances = result.data || [];
            renderInstances();
        })
        .catch(function() {
            var el = document.getElementById('tk-instance-list');
            if (el) el.innerHTML = '<div class="tk-empty">加载失败</div>';
        });
}

function renderInstances() {
    var el = document.getElementById('tk-instance-list');
    if (!el) return;
    if (!_instances.length) {
        el.innerHTML = '<div class="tk-empty">暂无任务，填写左侧表单启动一个</div>';
        return;
    }
    el.innerHTML = _instances.map(function(t) {
        var active = t.task_id === _selectedTaskId ? ' tk-active' : '';
        return '<div class="tk-instance' + active + '" onclick="selectInstance(\'' + esc(t.task_id) + '\')">'
             + '<div class="tk-instance-title">' + esc(t.title || t.task_id) + '</div>'
             + '<div class="tk-instance-meta">'
             + '<span class="tk-scene-tag">' + esc(t.scene || '') + '</span>'
             + '<span class="tk-status tk-status-' + esc(t.state) + '">' + esc(_statusLabel(t.state)) + '</span>'
             + '<span class="am-task-meta-tag">' + esc(_fmtTime(t.updated_at)) + '</span>'
             + '</div></div>';
    }).join('');
}

function selectInstance(taskId) {
    _selectedTaskId = taskId;
    _wsTaskId = null;
    _wsPath = '';
    _wsData = null;
    renderInstances();
    loadDetail(taskId);
    startPolling(taskId);
}

/* ═══ 详情 ═══ */
function loadDetail(taskId) {
    fetch('/api/tasks/instances/' + encodeURIComponent(taskId))
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.code !== 200) return;
            renderDetail(result.data);
        })
        .catch(function() {
            var el = document.getElementById('tk-detail');
            if (el) el.innerHTML = '<div class="tk-empty">加载失败</div>';
        });
}

function _nodeStatus(task, nodeKey) {
    var inArtifacts = task.artifacts && task.artifacts[nodeKey];
    if (task.state === 'done') return inArtifacts ? 'done' : 'pending';
    if (task.current_node === nodeKey) {
        if (task.state === 'awaiting_user') return 'awaiting';
        if (task.state === 'running') return 'running';
    }
    return inArtifacts ? 'done' : 'pending';
}

function _statusDot(status) {
    var icon = { done: '✓', running: '…', awaiting: '!', pending: '·' }[status] || '·';
    return '<div class="tk-node-dot ' + status + '">' + icon + '</div>';
}

function renderDetail(task) {
    var el = document.getElementById('tk-detail');
    if (!el) return;

    var head = '<div class="am-card-head" style="margin-bottom:12px">'
        + '<h2 class="am-card-title" style="font-size:16px">' + esc(task.title || task.task_id) + '</h2>'
        + '<div class="am-card-actions">'
        + '<span class="tk-status tk-status-' + esc(task.state) + '">' + esc(_statusLabel(task.state)) + '</span>'
        + '<button class="am-btn-ghost am-btn-xs" onclick="deleteInstance()">删除</button>'
        + '</div></div>';

    var nodes = task.plan || [];
    var pipeline = '<div class="tk-pipeline">' + nodes.map(function(node) {
        var status = _nodeStatus(task, node.key);
        var artifact = task.artifacts && task.artifacts[node.key];
        var summary = artifact && artifact.summary ? artifact.summary : '';
        var gateTag = node.gate ? '<span class="tk-node-gate">需确认</span>' : '';
        return '<div class="tk-node' + (status === 'running' || status === 'awaiting' ? ' tk-node-active' : '') + '">'
             + _statusDot(status)
             + '<div class="tk-node-body">'
             + '<div class="tk-node-head"><span class="tk-node-name">' + esc(node.name || node.key) + '</span>' + gateTag + '</div>'
             + (summary ? '<div class="tk-node-summary">' + esc(summary) + '</div>' : '')
             + '</div></div>';
    }).join('') + '</div>';

    var approve = '';
    if (task.state === 'awaiting_user') {
        var pending = task.pending_approval || {};
        approve = '<div class="tk-approve">'
            + '<div class="tk-approve-title">需要你的确认</div>'
            + '<div class="tk-approve-question">' + esc(pending.question || '请确认当前产出') + '</div>'
            + (pending.dangerous ? '<div class="tk-approve-danger">该步骤可能涉及写文件或导出，请仔细核对产出。</div>' : '')
            + '<div class="tk-approve-actions">'
            + '<button class="am-btn-primary" onclick="approveNode(true)">通过并继续</button>'
            + '<button class="am-btn-ghost" onclick="approveNode(false)">驳回重做</button>'
            + '</div></div>';
    } else if (task.state === 'paused') {
        approve = '<div class="tk-approve-actions" style="margin-top:16px">'
            + '<button class="am-btn-primary" onclick="resumeInstance()">继续执行</button>'
            + '</div>';
    } else if (task.state === 'running') {
        approve = '<div class="tk-approve-actions" style="margin-top:16px">'
            + '<button class="am-btn-ghost" onclick="pauseInstance()">暂停</button>'
            + '</div>';
    }

    var history = '';
    if (task.history && task.history.length) {
        var recent = task.history.slice(-8).reverse();
        history = '<div style="margin-top:16px"><div class="am-run-tools-label" style="margin-bottom:6px">最近动态</div>'
            + recent.map(function(h) {
                return '<div style="font-size:12px;color:var(--color-muted);padding:3px 0">'
                    + '<span style="font-family:var(--font-mono);margin-right:8px">' + esc(_fmtTime(h.at)) + '</span>'
                    + esc(h.event) + '</div>';
            }).join('') + '</div>';
    }

    var workspace = '<div class="tk-workspace" style="margin-top:16px">'
        + '<div class="am-run-tools-label" style="margin-bottom:6px">工作空间</div>'
        + '<div class="tk-ws-path" title="' + esc(task.workspace || '') + '">' + esc(task.workspace || '未设置') + '</div>'
        + '<div id="tk-ws-body" class="tk-ws-body"></div>'
        + '</div>';

    el.innerHTML = head + pipeline + approve + workspace + history;

    var isNewTask = task.task_id !== _wsTaskId;
    if (isNewTask) {
        _wsTaskId = task.task_id;
        loadWorkspace('');
    } else {
        renderWorkspaceBody();
    }
}

/* ═══ 操作 ═══ */
function createInstance() {
    var scene = document.getElementById('tk-new-scene').value;
    var title = document.getElementById('tk-new-title').value.trim();
    var goal = document.getElementById('tk-new-goal').value.trim();
    var workspace = document.getElementById('tk-new-workspace').value.trim();
    if (!goal) { showToast('请填写任务目标'); return; }

    var btn = document.getElementById('tk-create-btn');
    btn.disabled = true;

    fetch('/api/tasks/instances', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scene: scene, title: title, goal: goal, workspace: workspace })
    }).then(function(r) { return r.json(); })
      .then(function(res) {
          if (res.code === 200) {
              document.getElementById('tk-new-title').value = '';
              document.getElementById('tk-new-goal').value = '';
              document.getElementById('tk-new-workspace').value = '';
              showToast('任务已启动');
              loadInstances();
              selectInstance(res.data.task_id);
          } else {
              showToast(res.message || '启动失败');
          }
      })
      .catch(function(e) { showToast('请求失败: ' + e); })
      .finally(function() { btn.disabled = false; });
}

function approveNode(approved) {
    if (!_selectedTaskId) return;
    fetch('/api/tasks/instances/' + encodeURIComponent(_selectedTaskId) + '/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ approved: approved })
    }).then(function(r) { return r.json(); })
      .then(function(res) {
          if (res.code === 200) { loadDetail(_selectedTaskId); loadInstances(); }
          else { showToast(res.message || '操作失败'); }
      })
      .catch(function(e) { showToast('请求失败: ' + e); });
}

function pauseInstance() {
    if (!_selectedTaskId) return;
    fetch('/api/tasks/instances/' + encodeURIComponent(_selectedTaskId) + '/pause', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(res) { if (res.code === 200) { loadDetail(_selectedTaskId); loadInstances(); } })
        .catch(function() {});
}

function resumeInstance() {
    if (!_selectedTaskId) return;
    fetch('/api/tasks/instances/' + encodeURIComponent(_selectedTaskId) + '/resume', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function(res) { if (res.code === 200) { loadDetail(_selectedTaskId); loadInstances(); } })
        .catch(function() {});
}

function deleteInstance() {
    if (!_selectedTaskId) return;
    customConfirm('删除后无法恢复，是否继续？', '删除任务').then(function(ok) {
        if (!ok) return;
        fetch('/api/tasks/instances/' + encodeURIComponent(_selectedTaskId), { method: 'DELETE' })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (res.code === 200) {
                    _selectedTaskId = null;
                    document.getElementById('tk-detail').innerHTML = '<div class="tk-empty">选择左侧任务查看详情</div>';
                    loadInstances();
                }
            })
            .catch(function() {});
    });
}

/* ═══ 工作空间 ═══ */
function _jsstr(s) {
    return String(s == null ? '' : s)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;');
}

function loadWorkspace(path) {
    if (!_selectedTaskId) return;
    _wsPath = path || '';
    fetch('/api/tasks/instances/' + encodeURIComponent(_selectedTaskId) + '/workspace?path=' + encodeURIComponent(_wsPath))
        .then(function(r) { return r.json(); })
        .then(function(result) {
            _wsData = result.code === 200 ? result.data : { error: result.message || '加载失败' };
            renderWorkspaceBody();
        })
        .catch(function() { _wsData = { error: '加载失败' }; renderWorkspaceBody(); });
}

function renderWorkspaceBody() {
    var el = document.getElementById('tk-ws-body');
    if (!el) return;
    if (!_wsData) { el.innerHTML = '<div class="am-loading">加载中…</div>'; return; }
    if (_wsData.error) { el.innerHTML = '<div class="tk-empty">' + esc(_wsData.error) + '</div>'; return; }

    var cur = _wsData.path || '';
    var parts = cur ? cur.split('/').filter(Boolean) : [];
    var crumbs = '<span class="tk-ws-crumb" onclick="wsEnter(\'\')">根目录</span>';
    var acc = '';
    parts.forEach(function(p) {
        acc = acc ? acc + '/' + p : p;
        crumbs += '<span class="tk-ws-sep">/</span><span class="tk-ws-crumb" onclick="wsEnter(\'' + _jsstr(acc) + '\')">' + esc(p) + '</span>';
    });

    var icDir = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>';
    var icFile = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>';

    var entries = _wsData.entries || [];
    var list = '';
    if (!entries.length) {
        list = '<div class="tk-empty">（空文件夹）</div>';
    } else {
        list = entries.map(function(e) {
            if (e.type === 'dir') {
                return '<div class="tk-ws-entry" onclick="wsEnter(\'' + _jsstr(e.path) + '\')">'
                    + '<span class="tk-ws-ic">' + icDir + '</span>'
                    + '<span class="tk-ws-name">' + esc(e.name) + '</span>'
                    + '</div>';
            }
            return '<div class="tk-ws-entry" onclick="wsPreview(\'' + _jsstr(e.path) + '\')">'
                + '<span class="tk-ws-ic">' + icFile + '</span>'
                + '<span class="tk-ws-name">' + esc(e.name) + '</span>'
                + '<span class="tk-ws-size">' + (e.size != null ? _fmtSize(e.size) : '') + '</span>'
                + '</div>';
        }).join('');
    }

    var preview = '';
    if (_wsData._preview) {
        preview = '<pre class="tk-ws-preview">' + esc(_wsData._preview.content || '') + '</pre>';
    }

    el.innerHTML = '<div class="tk-ws-toolbar">' + crumbs + '</div>' + list + preview;
}

function _fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function wsEnter(path) {
    loadWorkspace(path);
}

function wsPreview(path) {
    if (!_selectedTaskId) return;
    fetch('/api/tasks/instances/' + encodeURIComponent(_selectedTaskId) + '/workspace/file?path=' + encodeURIComponent(path))
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (!_wsData) _wsData = {};
            _wsData._preview = result.code === 200
                ? { content: result.data.content || '' }
                : { content: '无法预览: ' + (result.message || '') };
            renderWorkspaceBody();
        })
        .catch(function() { showToast('预览失败'); });
}

/* ═══ 工作空间选择弹窗 ═══ */
function openWorkspacePicker() {
    var input = document.getElementById('tk-new-workspace');
    var start = input && input.value.trim() ? input.value.trim() : '';
    document.getElementById('tk-ws-modal').style.display = 'flex';
    wsPickerBrowse(start);
}

function closeWorkspacePicker() {
    document.getElementById('tk-ws-modal').style.display = 'none';
}

function wsPickerBrowse(path) {
    fetch('/api/tasks/workspace/browse?path=' + encodeURIComponent(path || ''))
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.code !== 200) { showToast(result.message || '浏览失败'); return; }
            _pickerPath = result.data.path;
            _pickerParent = result.data.parent;
            document.getElementById('tk-ws-pick-path').textContent = result.data.path;
            var list = document.getElementById('tk-ws-pick-list');
            var dirs = result.data.dirs || [];
            if (!dirs.length) {
                list.innerHTML = '<div class="tk-empty">（无子文件夹）</div>';
                return;
            }
            list.innerHTML = dirs.map(function(d) {
                var label = /^[A-Za-z]:\\$/.test(d.path) ? '盘符 ' + d.path : d.name;
                return '<div class="tk-ws-pick-item" onclick="wsPickerBrowse(\'' + _jsstr(d.path) + '\')">' + esc(label) + '</div>';
            }).join('');
        })
        .catch(function() { showToast('浏览失败'); });
}

function wsPickerUp() {
    if (_pickerParent) wsPickerBrowse(_pickerParent);
}

function wsPickerSelect() {
    if (!_pickerPath) { showToast('请先浏览到目标目录'); return; }
    document.getElementById('tk-new-workspace').value = _pickerPath;
    closeWorkspacePicker();
}

function wsPickerMkdir() {
    var name = document.getElementById('tk-ws-new-name').value.trim();
    if (!name) { showToast('请输入文件夹名'); return; }
    fetch('/api/tasks/workspace/mkdir', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ parent: _pickerPath, name: name })
    }).then(function(r) { return r.json(); })
      .then(function(result) {
          if (result.code !== 200) { showToast(result.message || '创建失败'); return; }
          document.getElementById('tk-ws-new-name').value = '';
          document.getElementById('tk-new-workspace').value = result.data.path;
          closeWorkspacePicker();
      })
      .catch(function() { showToast('创建失败'); });
}

/* ═══ 轮询 ═══ */
function startPolling(taskId) {
    if (_pollTimer) clearInterval(_pollTimer);
    _pollTimer = setInterval(function() {
        if (!_selectedTaskId || _selectedTaskId !== taskId) return;
        loadDetail(taskId);
        loadInstances();
    }, 2500);
}
</script>
{% endblock %}
