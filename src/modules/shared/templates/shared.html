{% extends "base.html" %}

{% block content %}
<div class="am-page" id="sh-page">
    <header class="am-top">
        <div class="am-top-left">
            <h1 class="am-h1">共享中心</h1>
            <span class="sh-subtitle">浏览同事与官方共享的 Skill / 工作流 / 智能体 / MCP 服务</span>
        </div>
    </header>

    <section class="am-card">
        <div class="am-card-head">
            <h2 class="am-card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                共享条目
            </h2>
            <div class="sh-head-actions">
                <button class="am-btn-ghost am-btn-xs" onclick="openPublish()">发布</button>
                <button class="am-btn-ghost am-btn-xs" onclick="loadItems()">刷新</button>
            </div>
        </div>
        <div class="sh-list" id="sh-list">
            <div class="am-loading">加载中…</div>
        </div>
    </section>

    <!-- ═══ 详情抽屉 ═══ -->
    <div class="am-modal-overlay" id="sh-detail-modal" style="display:none" onclick="if(event.target===this)hideDetail()">
        <div class="am-modal" style="max-width:560px">
            <div class="am-modal-head">
                <h3 class="am-modal-title" id="sh-detail-title">详情</h3>
                <button class="am-modal-close" onclick="hideDetail()" aria-label="关闭">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="am-modal-body" id="sh-detail-body">
                <div class="am-loading">加载中…</div>
            </div>
            <div class="am-modal-foot">
                <button class="am-btn-ghost" onclick="hideDetail()">关闭</button>
                <button class="am-btn-primary" id="sh-detail-install-btn" onclick="installFromDetail()">安装</button>
            </div>
        </div>
    </div>

    <!-- ═══ 发布弹窗 ═══ -->
    <div class="am-modal-overlay" id="sh-publish-modal" style="display:none" onclick="if(event.target===this)closePublish()">
        <div class="am-modal" style="max-width:640px">
            <div class="am-modal-head">
                <h3 class="am-modal-title">发布共享条目</h3>
                <button class="am-modal-close" onclick="closePublish()" aria-label="关闭">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="am-modal-body sh-pub-body">
                <div class="sh-form-grid">
                    <label class="sh-field">
                        <span>类型</span>
                        <select id="sh-pub-type" onchange="updatePreview()">
                            <option value="skill">Skill</option>
                            <option value="agent">智能体</option>
                        </select>
                    </label>
                    <label class="sh-field">
                        <span>名称（kebab-case）</span>
                        <input id="sh-pub-name" type="text" placeholder="my-skill" oninput="updatePreview()">
                    </label>
                    <label class="sh-field">
                        <span>描述</span>
                        <input id="sh-pub-desc" type="text" placeholder="一句话说明" oninput="updatePreview()">
                    </label>
                    <label class="sh-field">
                        <span>版本</span>
                        <input id="sh-pub-version" type="text" placeholder="1.0.0" oninput="updatePreview()">
                    </label>
                    <label class="sh-field">
                        <span>作者</span>
                        <input id="sh-pub-author" type="text" placeholder="zhang.san" oninput="updatePreview()">
                    </label>
                    <label class="sh-field">
                        <span>来源等级</span>
                        <select id="sh-pub-level" onchange="updatePreview()">
                            <option value="同事">同事</option>
                            <option value="官方库">官方库</option>
                            <option value="外部">外部</option>
                        </select>
                    </label>
                </div>
                <label class="sh-field">
                    <span>内容</span>
                    <textarea id="sh-pub-content" rows="7" placeholder="Skill 正文或智能体定义内容" oninput="updatePreview()"></textarea>
                </label>
                <div class="sh-kv-section">manifest 预览</div>
                <pre class="sh-pre" id="sh-pub-preview">{}</pre>
            </div>
            <div class="am-modal-foot">
                <button class="am-btn-ghost" onclick="closePublish()">取消</button>
                <button class="am-btn-primary" onclick="submitPublish()">确认发布</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
onPageReady(function() {
    loadItems();
});

var _detailPath = '';

function esc(str) { var d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
function escAttr(str) { return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function sourceBadge(level) {
    if (level === '官方库') return '<span class="am-tag am-tag-builtin">官方库</span>';
    if (level === '外部') return '<span class="am-tag am-tag-remote">外部</span>';
    return '<span class="am-tag am-tag-custom">' + esc(level || '同事') + '</span>';
}

function typeLabel(t) {
    var map = {skill:'Skill', workflow:'工作流', agent:'智能体', 'mcp-server':'MCP 服务'};
    return map[t] || t;
}

function loadItems() {
    fetch('/api/shared/items')
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.code !== 200) { renderEmpty(result.message || '加载失败'); return; }
            renderItems(result.data || []);
        })
        .catch(function() { renderEmpty('加载失败'); });
}

function renderEmpty(msg) {
    document.getElementById('sh-list').innerHTML = '<div class="am-empty">' + esc(msg || '暂无共享条目') + '</div>';
}

function renderItems(items) {
    var container = document.getElementById('sh-list');
    if (!items || items.length === 0) { renderEmpty('暂无共享条目'); return; }
    container.innerHTML = items.map(function(it) {
        var install = it.install || {};
        return '<div class="am-mcp-card sh-card">'
            + '<div class="am-mcp-name-row sh-item-top">'
            + '<span class="am-mcp-name sh-item-name" title="' + escAttr(it.name) + '">' + esc(it.name) + '</span>'
            + '<span class="am-mcp-badge">' + esc(typeLabel(it.type)) + '</span>'
            + sourceBadge(it.source_level)
            + '</div>'
            + '<div class="am-mcp-sub sh-item-desc">' + esc(it.description || '') + '</div>'
            + '<div class="sh-item-meta">'
            + (it.version ? '<span>v' + esc(it.version) + '</span>' : '')
            + (it.author ? '<span>' + esc(it.author) + '</span>' : '')
            + '<span>' + esc(install.kind || '') + ' → ' + esc(install.target || '') + '</span>'
            + '</div>'
            + '<div class="sh-item-foot">'
            + '<button class="am-btn-ghost am-btn-xs" onclick="showDetail(\'' + escAttr(it.path) + '\')">详情</button>'
            + '<button class="am-btn-primary am-btn-xs" onclick="installItem(\'' + escAttr(it.path) + '\', \'' + escAttr(it.name) + '\')">安装</button>'
            + '</div>'
            + '</div>';
    }).join('');
}

function showDetail(path) {
    _detailPath = path;
    document.getElementById('sh-detail-modal').style.display = '';
    document.getElementById('sh-detail-title').textContent = '详情';
    document.getElementById('sh-detail-body').innerHTML = '<div class="am-loading">加载中…</div>';
    fetch('/api/shared/items/' + encodeURIComponent(path))
        .then(function(r) { return r.json(); })
        .then(function(result) {
            if (result.code !== 200) { document.getElementById('sh-detail-body').innerHTML = '<div class="am-empty">' + esc(result.message || '加载失败') + '</div>'; return; }
            renderDetail(result.data);
        })
        .catch(function() { document.getElementById('sh-detail-body').innerHTML = '<div class="am-empty">加载失败</div>'; });
}

function renderDetail(d) {
    var install = d.install || {};
    var requiresMcp = (d.requires_mcp || []).join(', ');
    var html = '<div class="sh-kv">'
        + '<div class="am-mcp-name-row sh-item-top"><span class="am-mcp-name sh-item-name">' + esc(d.name) + '</span><span class="am-mcp-badge">' + esc(typeLabel(d.type)) + '</span>' + sourceBadge(d.source_level) + '</div>'
        + '<div class="sh-kv-row"><span class="sh-kv-key">描述</span><span class="sh-kv-val">' + esc(d.description || '—') + '</span></div>'
        + '<div class="sh-kv-row"><span class="sh-kv-key">版本</span><span class="sh-kv-val">' + esc(d.version || '—') + '</span></div>'
        + '<div class="sh-kv-row"><span class="sh-kv-key">作者</span><span class="sh-kv-val">' + esc(d.author || '—') + '</span></div>'
        + '<div class="sh-kv-row"><span class="sh-kv-key">来源等级</span><span class="sh-kv-val">' + esc(d.source_level || '同事') + '</span></div>'
        + '<div class="sh-kv-row"><span class="sh-kv-key">DSH 依赖</span><span class="sh-kv-val">' + esc(d.requires_dsh || '—') + '</span></div>'
        + '<div class="sh-kv-row"><span class="sh-kv-key">MCP 依赖</span><span class="sh-kv-val">' + esc(requiresMcp || '—') + '</span></div>'
        + '<div class="sh-kv-row"><span class="sh-kv-key">安装动作</span><span class="sh-kv-val">' + esc(install.kind || '') + ' → ' + esc(install.target || '') + '</span></div>'
        + '</div>'
        + '<div class="sh-kv-section">manifest</div>'
        + '<pre class="sh-pre">' + esc(JSON.stringify(d.manifest || {}, null, 2)) + '</pre>';
    document.getElementById('sh-detail-body').innerHTML = html;
    document.getElementById('sh-detail-title').textContent = d.name || '详情';
}

function installFromDetail() {
    if (_detailPath) installItem(_detailPath, '');
}

function installItem(path, name) {
    var label = name || path;
    customConfirm('确定安装「' + label + '」？安装前请确认来源等级可信。', '安装共享条目', { primary: true, okText: '安装' }).then(function(ok) {
        if (!ok) return;
        _doInstall(path);
    });
}

function _doInstall(path) {
    fetch('/api/shared/install', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({path: path})
    })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res.code === 200) {
                var d = res.data || {};
                showToast(d.message || '安装成功');
                hideDetail();
            } else {
                showToast(res.message || '安装失败');
            }
        })
        .catch(function(e) { showToast('安装失败: ' + e); });
}

function hideDetail() {
    document.getElementById('sh-detail-modal').style.display = 'none';
    _detailPath = '';
}

// ─── 发布 ───
function openPublish() {
    document.getElementById('sh-pub-type').value = 'skill';
    document.getElementById('sh-pub-name').value = '';
    document.getElementById('sh-pub-desc').value = '';
    document.getElementById('sh-pub-version').value = '';
    document.getElementById('sh-pub-author').value = '';
    document.getElementById('sh-pub-level').value = '同事';
    document.getElementById('sh-pub-content').value = '';
    updatePreview();
    document.getElementById('sh-publish-modal').style.display = '';
}

function closePublish() {
    document.getElementById('sh-publish-modal').style.display = 'none';
}

function buildPublishManifest() {
    var type = document.getElementById('sh-pub-type').value;
    var name = document.getElementById('sh-pub-name').value.trim();
    var m = {
        type: type,
        name: name,
        description: document.getElementById('sh-pub-desc').value.trim(),
        version: document.getElementById('sh-pub-version').value.trim(),
        author: document.getElementById('sh-pub-author').value.trim(),
        source_level: document.getElementById('sh-pub-level').value,
        content: document.getElementById('sh-pub-content').value
    };
    m.install = {kind: 'copy-to', target: (type === 'agent' ? 'agents/' : 'skills/')};
    return m;
}

function updatePreview() {
    var m = buildPublishManifest();
    document.getElementById('sh-pub-preview').textContent = JSON.stringify(m, null, 2);
}

function submitPublish() {
    var m = buildPublishManifest();
    if (!m.name) { showToast('请填写名称'); return; }
    if (!m.content.trim()) { showToast('请填写内容'); return; }
    customConfirm('确认发布「' + m.name + '」到共享仓库？', '发布共享条目', { primary: true, okText: '发布' }).then(function(ok) {
        if (!ok) return;
        fetch('/api/shared/publish', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(m)
        })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (res.code === 200) {
                    var d = res.data || {};
                    var parts = [d.git || res.message];
                    if (d.warning) parts.push(d.warning);
                    showToast(parts.filter(Boolean).join(' | '));
                    closePublish();
                    loadItems();
                } else {
                    showToast(res.message || '发布失败');
                }
            })
            .catch(function(e) { showToast('发布失败: ' + e); });
    });
}
</script>
{% endblock %}
