<svg viewBox="0 0 800 520" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>write_note 内联图片提取数据流</title>
  <desc>MCP 客户端发送含 data:image base64 的 Markdown → write_note handler 提取/解码/替换 → 写入 .md 文件 → PersonLLMWiki 渲染器自动解析。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t    { font: 400 13px sans-serif; fill: #222; }
      .ts   { font: 400 11px sans-serif; fill: #666; }
      .th   { font: 600 14px sans-serif; fill: #222; }
      .code { font: 400 10.5px 'Cascadia Code', 'Consolas', monospace; fill: #444; }
      .arr  { stroke: #888; stroke-width: 1.5; fill: none; }
      .arr-thin { stroke: #AAA; stroke-width: 1.2; fill: none; }
      .arr-red { stroke: #DC2626; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- ========== Step 1: MCP 客户端发送 ========== -->
  <rect x="40" y="20" width="720" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="400" y="42" text-anchor="middle" dominant-baseline="central">MCP 客户端发送 write_note</text>
  <text class="code" x="400" y="62" text-anchor="middle" dominant-baseline="central">content = "# 会议\n\n![截图](data:image/png;base64,iVBOR...)\n\n正文"</text>

  <path class="arr" d="M400 78 L400 102" marker-end="url(#arrow)"/>

  <!-- ========== Step 2: write_note handler ========== -->
  <rect x="40" y="104" width="720" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="400" y="124" text-anchor="middle" dominant-baseline="central">handle_write_note 接收 content，调用 extract_inline_images()</text>

  <path class="arr" d="M400 140 L400 164" marker-end="url(#arrow)"/>

  <!-- ========== Step 3: extract_inline_images ========== -->
  <rect x="40" y="166" width="720" height="130" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="400" y="186" text-anchor="middle" dominant-baseline="central">image_extractor.py — extract_inline_images(content, image_dir, prefix)</text>

  <!-- Sub-steps -->
  <rect x="60" y="196" width="160" height="28" rx="5" fill="#FDF8F0" stroke="#854F0B" stroke-width="0.3"/>
  <text class="ts" x="140" y="211" text-anchor="middle" dominant-baseline="central" font-size="10">正则匹配 data:image</text>

  <rect x="236" y="196" width="160" height="28" rx="5" fill="#FDF8F0" stroke="#854F0B" stroke-width="0.3"/>
  <text class="ts" x="316" y="211" text-anchor="middle" dominant-baseline="central" font-size="10">base64 解码 → 文件</text>

  <rect x="412" y="196" width="160" height="28" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.3"/>
  <text class="ts" x="492" y="211" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#991B1B">SVG: 过滤 &lt;script&gt;</text>

  <rect x="588" y="196" width="152" height="28" rx="5" fill="#FDF8F0" stroke="#854F0B" stroke-width="0.3"/>
  <text class="ts" x="664" y="211" text-anchor="middle" dominant-baseline="central" font-size="10">替换 Markdown 引用</text>

  <!-- Sub-step arrows -->
  <path class="arr-thin" d="M220 210 L236 210" marker-end="url(#arrow)"/>
  <path class="arr-thin" d="M396 210 L412 210" marker-end="url(#arrow)"/>
  <path class="arr-thin" d="M572 210 L588 210" marker-end="url(#arrow)"/>

  <!-- Example -->
  <rect x="60" y="232" width="680" height="24" rx="4" fill="#F9F6EC" stroke="#E8D8B8" stroke-width="0.3"/>
  <text class="ts" x="400" y="245" text-anchor="middle" dominant-baseline="central" font-size="10">
    data:image/png;base64,iVBOR...  →  保存到 resource/img/会议/img_0001.png  →  ![截图](img/会议/img_0001.png)
  </text>

  <!-- Branch: error path -->
  <rect x="60" y="264" width="680" height="24" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.2"/>
  <text class="ts" x="400" y="277" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#991B1B">
    ⚠ 解码失败 → 保留原始 data: URI（不丢失数据），继续处理后续图片
  </text>

  <path class="arr" d="M400 296 L400 320" marker-end="url(#arrow)"/>

  <!-- ========== Step 4: 写入 ========== -->
  <rect x="40" y="322" width="720" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ts" x="400" y="342" text-anchor="middle" dominant-baseline="central">将 new_content（已替换引用）写入 .md 文件  →  返回 image_paths 给调用方</text>

  <path class="arr" d="M400 358 L400 382" marker-end="url(#arrow)"/>

  <!-- ========== Step 5: ZSSNote 渲染 ========== -->
  <rect x="40" y="384" width="720" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="400" y="404" text-anchor="middle" dominant-baseline="central">ZSSNote 已有渲染逻辑（无需改动）</text>

  <path class="arr" d="M400 420 L400 444" marker-end="url(#arrow)"/>

  <rect x="40" y="446" width="720" height="36" rx="8" fill="#F9F9F8" stroke="#5F5E5A" stroke-width="0.3"/>
  <text class="code" x="400" y="466" text-anchor="middle" dominant-baseline="central">markdown_service.rewrite_image_links  →  img/会议/img_0001.png  →  /api/article/image?image_path=...&amp;img=img_0001.png</text>

  <!-- Supported formats -->
  <rect x="40" y="492" width="720" height="22" rx="6" fill="#F9F9F8" stroke="#E0DED8" stroke-width="0.3"/>
  <text class="ts" x="400" y="505" text-anchor="middle" dominant-baseline="central" font-size="9">
    支持格式：PNG / JPEG / GIF / BMP / WebP / SVG（自动过滤 &lt;script&gt; 防 XSS）
  </text>

</svg>
