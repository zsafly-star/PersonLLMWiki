<svg viewBox="0 0 920 560" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>PersonLLMWiki 双角色 MCP 架构</title>
  <desc>PersonLLMWiki 同时作为 MCP Server（对外暴露 /mcp 端点）和 MCP Client（通过 MCPClientBus 连接外部服务器），统一由 Agent 循环调度全部工具。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t   { font: 400 13px sans-serif; fill: #222; }
      .ts  { font: 400 11.5px sans-serif; fill: #666; }
      .th  { font: 600 14px sans-serif; fill: #222; }
      .tlab{ font: 500 13px sans-serif; fill: #5F5E5A; }
      .arr { stroke: #888; stroke-width: 1.5; fill: none; }
      .arr-dash { stroke: #888; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arr-thin { stroke: #AAA; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <!-- ========== 外部世界 ========== -->
  <rect x="20" y="10" width="880" height="76" rx="10" fill="#F9F9F8" stroke="#E0DED8" stroke-width="0.5"/>
  <text class="ts" x="36" y="30" dominant-baseline="central" font-size="10">外部</text>

  <!-- 外部 MCP 客户端 -->
  <rect x="45" y="22" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="165" y="42" text-anchor="middle" dominant-baseline="central">外部 MCP 客户端</text>
  <text class="ts" x="165" y="62" text-anchor="middle" dominant-baseline="central">Claude Desktop · VS Code · Cursor</text>

  <!-- 浏览器 -->
  <rect x="635" y="22" width="240" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="755" y="42" text-anchor="middle" dominant-baseline="central">Browser</text>
  <text class="ts" x="755" y="62" text-anchor="middle" dominant-baseline="central">ZSSNote Web UI</text>

  <!-- ========== ZSSNote Flask App 边框 ========== -->
  <rect x="20" y="100" width="880" height="280" rx="14" fill="#FAFAF9" stroke="#534AB7" stroke-width="1.2"/>
  <text class="tlab" x="36" y="120" dominant-baseline="central">ZSSNote Flask App</text>

  <!-- MCP Server -->
  <rect x="40" y="132" width="260" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="170" y="154" text-anchor="middle" dominant-baseline="central">MCP Server</text>
  <text class="ts" x="170" y="174" text-anchor="middle" dominant-baseline="central">POST /mcp · JSON-RPC 2.0</text>
  <text class="ts" x="170" y="192" text-anchor="middle" dominant-baseline="central">24 内置工具 (4 Tier)</text>

  <!-- MCPClientBus 总线 -->
  <rect x="315" y="132" width="270" height="72" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="450" y="154" text-anchor="middle" dominant-baseline="central">MCPClientBus 总线</text>
  <text class="ts" x="450" y="174" text-anchor="middle" dominant-baseline="central">sap-mcp → MCPRemote</text>
  <text class="ts" x="450" y="192" text-anchor="middle" dominant-baseline="central">自定义... → MCPRemote</text>

  <!-- REST /api/* -->
  <rect x="600" y="132" width="280" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="740" y="154" text-anchor="middle" dominant-baseline="central">REST /api/*</text>
  <text class="ts" x="740" y="174" text-anchor="middle" dominant-baseline="central">Wiki · 对话 · 编译</text>
  <text class="ts" x="740" y="192" text-anchor="middle" dominant-baseline="central">SSE 流式 · Blueprint 路由</text>

  <!-- Agent Loop -->
  <rect x="40" y="222" width="840" height="50" rx="10" fill="#F1EFFB" stroke="#7C3AED" stroke-width="0.5"/>
  <text class="th" x="460" y="240" text-anchor="middle" dominant-baseline="central">Agent 循环 (common/agent.py)</text>
  <text class="ts" x="460" y="260" text-anchor="middle" dominant-baseline="central">LLM + 全部 MCP 工具（内置 + 远程统一调度）· ≤10 轮 tool-calling</text>

  <!-- ========== Shared Service Layer ========== -->
  <rect x="20" y="288" width="880" height="62" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="tlab" x="36" y="306" dominant-baseline="central" font-size="11">Shared Service Layer</text>

  <rect x="36" y="316" width="200" height="28" rx="6" fill="#FDF8F0" stroke="#854F0B" stroke-width="0.4"/>
  <text class="t" x="136" y="332" text-anchor="middle" dominant-baseline="central" font-size="11">wiki_service</text>

  <rect x="248" y="316" width="200" height="28" rx="6" fill="#FDF8F0" stroke="#854F0B" stroke-width="0.4"/>
  <text class="t" x="348" y="332" text-anchor="middle" dominant-baseline="central" font-size="11">retrieval</text>

  <rect x="460" y="316" width="200" height="28" rx="6" fill="#FDF8F0" stroke="#854F0B" stroke-width="0.4"/>
  <text class="t" x="560" y="332" text-anchor="middle" dominant-baseline="central" font-size="11">compiler / pipeline</text>

  <rect x="672" y="316" width="208" height="28" rx="6" fill="#FDF8F0" stroke="#854F0B" stroke-width="0.4"/>
  <text class="t" x="776" y="332" text-anchor="middle" dominant-baseline="central" font-size="11">article_service</text>

  <!-- ========== 存储 & 外部依赖 ========== -->
  <rect x="20" y="395" width="880" height="78" rx="10" fill="#F9F9F8" stroke="#E0DED8" stroke-width="0.5"/>
  <text class="ts" x="36" y="414" dominant-baseline="central" font-size="10">存储 &amp; 外部依赖</text>

  <!-- Filesystem -->
  <rect x="36" y="420" width="190" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="131" y="438" text-anchor="middle" dominant-baseline="central" font-size="12">Filesystem</text>
  <text class="ts" x="131" y="456" text-anchor="middle" dominant-baseline="central" font-size="10">resource/*.md</text>

  <!-- SQLite -->
  <rect x="242" y="420" width="190" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="337" y="438" text-anchor="middle" dominant-baseline="central" font-size="12">SQLite</text>
  <text class="ts" x="337" y="456" text-anchor="middle" dominant-baseline="central" font-size="10">metadata · wiki page</text>

  <!-- OpenAI API -->
  <rect x="448" y="420" width="200" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="548" y="438" text-anchor="middle" dominant-baseline="central" font-size="12">OpenAI API</text>
  <text class="ts" x="548" y="456" text-anchor="middle" dominant-baseline="central" font-size="10">Embedding + LLM</text>

  <!-- 外部 MCP 服务器 -->
  <rect x="664" y="420" width="216" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="772" y="438" text-anchor="middle" dominant-baseline="central" font-size="12">外部 MCP 服务器</text>
  <text class="ts" x="772" y="456" text-anchor="middle" dominant-baseline="central" font-size="10">sap-mcp · 自定义...</text>

  <!-- ========== 图例 ========== -->
  <rect x="20" y="486" width="880" height="34" rx="8" fill="#F9F9F8" stroke="#E0DED8" stroke-width="0.4"/>
  <rect x="36" y="496" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.4"/>
  <text class="ts" x="56" y="504" dominant-baseline="central" font-size="10">MCP Server</text>
  <rect x="148" y="496" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.4"/>
  <text class="ts" x="168" y="504" dominant-baseline="central" font-size="10">MCP Client</text>
  <rect x="260" y="496" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.4"/>
  <text class="ts" x="280" y="504" dominant-baseline="central" font-size="10">REST API</text>
  <rect x="368" y="496" width="14" height="14" rx="3" fill="#F1EFFB" stroke="#7C3AED" stroke-width="0.4"/>
  <text class="ts" x="388" y="504" dominant-baseline="central" font-size="10">Agent</text>
  <rect x="458" y="496" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.4"/>
  <text class="ts" x="478" y="504" dominant-baseline="central" font-size="10">Service</text>
  <rect x="556" y="496" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.4"/>
  <text class="ts" x="576" y="504" dominant-baseline="central" font-size="10">存储</text>
  <line x1="670" y1="503" x2="700" y2="503" stroke="#888" stroke-width="1.5"/>
  <text class="ts" x="708" y="504" dominant-baseline="central" font-size="10">数据流</text>
  <line x1="770" y1="503" x2="800" y2="503" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="ts" x="808" y="504" dominant-baseline="central" font-size="10">远程调用</text>

  <!-- ========== 箭头 ========== -->

  <!-- 外部 MCP 客户端 → MCP Server -->
  <path class="arr" d="M165 74 L170 132" marker-end="url(#arrow)"/>
  <text class="ts" x="188" y="104" dominant-baseline="central" font-size="9">JSON-RPC</text>

  <!-- Browser → REST -->
  <path class="arr" d="M755 74 L740 132" marker-end="url(#arrow)"/>
  <text class="ts" x="712" y="104" dominant-baseline="central" font-size="9">HTTP</text>

  <!-- MCP Server → Agent Loop -->
  <path class="arr" d="M170 204 L170 222" marker-end="url(#arrow)"/>

  <!-- REST → Agent Loop -->
  <path class="arr" d="M740 204 L740 222" marker-end="url(#arrow)"/>

  <!-- Agent Loop → MCPClientBus (双向，工具调用) -->
  <path class="arr" d="M450 222 L450 204" marker-end="url(#arrow)"/>
  <text class="ts" x="468" y="205" dominant-baseline="central" font-size="9" fill="#888">工具调用</text>

  <!-- Agent Loop → Service Layer -->
  <path class="arr-thin" d="M290 272 L290 288" marker-end="url(#arrow)"/>
  <path class="arr" d="M450 272 L450 288" marker-end="url(#arrow)"/>
  <path class="arr-thin" d="M610 272 L610 288" marker-end="url(#arrow)"/>

  <!-- REST → Service Layer (直接绕过 Agent) -->
  <path class="arr-thin" d="M805 204 L805 316" marker-end="url(#arrow)"/>

  <!-- Service → 存储 -->
  <path class="arr" d="M131 344 L131 420" marker-end="url(#arrow)"/>
  <path class="arr" d="M337 344 L337 420" marker-end="url(#arrow)"/>
  <path class="arr" d="M548 344 L548 420" marker-end="url(#arrow)"/>

  <!-- MCPClientBus → 外部 MCP 服务器 (远程调用，虚线) -->
  <path class="arr-dash" d="M585 168 L870 168 L870 405 L830 420" marker-end="url(#arrow)"/>
  <text class="ts" x="875" y="280" dominant-baseline="central" font-size="9" fill="#888">远程 MCP 协议</text>

</svg>
